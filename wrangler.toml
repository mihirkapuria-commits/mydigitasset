name = "mydigitasset"
compatibility_date = "2026-03-01"
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mydigitasset-staging-db"
database_id = "061175d7-661b-4fe8-bce2-c334b08a1750"
migrations_dir = "./migrations"
[triggers]
crons = [
  "45 0 * * *", # 06:15 IST
  "10 1 * * *", # 06:40 IST
  "35 1 * * *", # 07:05 IST
  "45 1 * * *", # 07:15 IST (customer reminders)
  "0 2 * * *",  # 07:30 IST
  "25 2 * * *", # 07:55 IST
  "15 3 * * *", # 08:45 IST (recovery)
  "40 3 * * *", # 09:10 IST (recovery)
  "5 4 * * *"   # 09:35 IST (recovery)
]

[[r2_buckets]]
binding = "AD_IMAGES"
bucket_name = "mydigitasset-ad-images"
