name: Validate MyDigitAsset Worker

on:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - '.github/workflows/validate-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and reconcile the incomplete lockfile
        run: npm install --include=optional --no-audit --no-fund

      - name: Build website and Cloudflare Worker
        run: npm run build
