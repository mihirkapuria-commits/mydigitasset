name: Validate MyDigitAsset Admin CMS Feature

on:
  push:
    branches:
      - feature/admin-cms-promotions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Build website and Worker
        run: npm run build
